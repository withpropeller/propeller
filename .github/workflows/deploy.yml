name: Deploy to GHCR

on:
  push:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'workers/**'
      - 'libs/**'
      - 'infra/docker/**'
      - '.github/deploy-config.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to build'
        required: true
        type: choice
        options:
          - landing
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: 'stg'
        options:
          - stg
          - prod

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.inputs.component || github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.detect.outputs.components }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMPONENT: ${{ inputs.component }}
        run: |
          # Manual dispatch — deploy exactly what the user asked for
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "components=[\"$INPUT_COMPONENT\"]" >> "$GITHUB_OUTPUT"
            echo "Manual deploy: $INPUT_COMPONENT"
            exit 0
          fi

          # Auto — diff against the merge-base for multi-commit pushes
          BASE=$(git merge-base HEAD origin/master 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || echo "HEAD^")
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files (since $BASE):"
          echo "$CHANGED_FILES"

          # Simple detection: check if any path prefix for each component matches
          CHANGED=""
          # landing: apps/landing/ or infra/docker/Dockerfile.landing or infra/docker/nginx.landing.conf
          if echo "$CHANGED_FILES" | grep -qE '^(apps/landing/|infra/docker/Dockerfile\.landing|infra/docker/nginx\.landing\.conf)'; then
            CHANGED="$CHANGED landing"
          fi

          # admin: apps/admin/ or infra/docker/Dockerfile.vite
          if echo "$CHANGED_FILES" | grep -qE '^(apps/admin/|infra/docker/Dockerfile\.vite)'; then
            CHANGED="$CHANGED admin"
          fi

          if [ -z "$CHANGED" ]; then
            echo "components=[]" >> "$GITHUB_OUTPUT"
            echo "No components changed"
          else
            CHANGED_JSON=$(echo $CHANGED | tr ' ' '\n' | jq -R . | jq -sc .)
            echo "components=$CHANGED_JSON" >> "$GITHUB_OUTPUT"
            echo "Changed:$CHANGED"
          fi

  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.components != '[]' && needs.detect.outputs.components != ''
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect.outputs.components) }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read component config
        id: cfg
        run: |
          import yaml
          with open(".github/deploy-config.yml") as f:
              config = yaml.safe_load(f)

          g = config["global"]
          c = config["components"]["${{ matrix.component }}"]

          with open("${{ github.output }}", "a") as out:
              out.write(f"registry={g['registry']}\n")
              out.write(f"repo={g['repo']}\n")
              out.write(f"context={c['context']}\n")
              out.write(f"dockerfile={c['dockerfile']}\n")

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.cfg.outputs.repo }}/${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ inputs.environment }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cast:
    name: Cast ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect.outputs.components) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read component config
        id: cfg
        shell: python
        run: |
          import yaml, os
          with open(".github/deploy-config.yml") as f:
              config = yaml.safe_load(f)
          cast = config["components"]["${{ matrix.component }}"].get("cast", "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"cast={cast}\n")
              out.write(f"has_cast={'true' if cast else 'false'}\n")

      - uses: runestack/rune-cast-action@v1
        if: steps.cfg.outputs.has_cast == 'true'
        with:
          server: ${{ vars.RUNED_HOST }}
          token: ${{ secrets.RUNE_TOKEN }}
          source: ${{ steps.cfg.outputs.cast }}
          values: infra/runeset/values/${{ inputs.environment }}.yaml
          namespace: ${{ inputs.environment }}
          create-namespace: true
