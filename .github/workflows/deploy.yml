name: Deploy (auto)

# Auto-deploy on push to dev / main.
# Detects changed components from deploy-config.yml paths, builds + casts.
#
# For manual deploys see deploy-component.yml

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'workers/**'
      - 'libs/**'
      - 'infra/docker/**'
      - '.github/deploy-config.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.detect.outputs.components }}
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        env:
          BRANCH: ${{ github.ref_name }}
        shell: python
        run: |
          import yaml, os, fnmatch, subprocess, json

          with open('.github/deploy-config.yml') as f:
              config = yaml.safe_load(f)

          env_map = config.get('environments', {})
          environment = env_map.get(os.environ['BRANCH'], os.environ['BRANCH'])

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'],
              text=True
          ).splitlines()

          detected = []
          for name in sorted(config.get('components', {}).keys()):
              comp = config['components'][name]
              paths = comp.get('paths', [])
              if not paths:
                  continue
              for cf in changed:
                  for pat in paths:
                      if fnmatch.fnmatch(cf, pat):
                          detected.append(name)
                          break
                  else:
                      continue
                  break

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'environment={environment}\n')
              out.write(f'components={json.dumps(detected)}\n')

          print(f'branch={os.environ["BRANCH"]} → environment={environment}')
          print(f'changed files: {changed}')
          print(f'detected: {detected}')

  deploy:
    name: Deploy ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.components != '[]' && needs.detect.outputs.components != ''
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect.outputs.components) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Prep
        id: prep
        uses: ./.github/actions/cast-prep
        with:
          component: ${{ matrix.component }}
          environment: ${{ needs.detect.outputs.environment }}
          sha: ${{ github.sha }}
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        if: steps.prep.outputs.has_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.prep.outputs.has_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.prep.outputs.has_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.prep.outputs.context }}
          file: ${{ steps.prep.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}:${{ steps.prep.outputs.image_tag }}
            ${{ steps.prep.outputs.image_name }}:${{ needs.detect.outputs.environment }}
          build-args: ${{ steps.prep.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cast
        if: steps.prep.outputs.has_cast == 'true'
        uses: runestack/rune-cast-action@v1
        with:
          server: ${{ secrets.RUNED_HOST }}
          token: ${{ secrets.RUNE_TOKEN }}
          source: ${{ steps.prep.outputs.cast_file }}
          values: ${{ steps.prep.outputs.values_files }}
          namespace: ${{ steps.prep.outputs.namespace }}
          create-namespace: true
