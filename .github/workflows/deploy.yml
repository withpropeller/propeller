name: Deploy (auto)

# Auto-deploy on push to dev / main.
# Detects changed components from deploy-config.yml paths, builds + casts.
#
# For manual deploys see deploy-component.yml

on:
  push:
    branches: [dev, main]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'workers/**'
      - 'libs/**'
      - 'infra/docker/**'
      - '.github/deploy-config.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.detect.outputs.components }}
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        env:
          BRANCH: ${{ github.ref_name }}
        shell: python
        run: |
          import yaml, os, fnmatch, subprocess, json

          with open('.github/deploy-config.yml') as f:
              config = yaml.safe_load(f)

          # Resolve environment from branch
          env_map = config.get('environments', {})
          environment = env_map.get(os.environ['BRANCH'], os.environ['BRANCH'])

          # Get changed files
          try:
              base = subprocess.check_output(
                  ['git', 'merge-base', 'HEAD', f'origin/{os.environ["BRANCH"]}'],
                  text=True
              ).strip()
          except Exception:
              base = 'HEAD^'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'],
              text=True
          ).splitlines()

          detected = []
          for name in sorted(config.get('components', {}).keys()):
              comp = config['components'][name]
              paths = comp.get('paths', [])
              if not paths:
                  continue
              for cf in changed:
                  for pat in paths:
                      if fnmatch.fnmatch(cf, pat):
                          detected.append(name)
                          break
                  else:
                      continue
                  break

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'environment={environment}\n')
              out.write(f'components={json.dumps(detected)}\n')

          print(f'branch={os.environ["BRANCH"]} → environment={environment}')
          print(f'changed files: {changed}')
          print(f'detected: {detected}')

  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.components != '[]' && needs.detect.outputs.components != ''
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect.outputs.components) }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read component config
        id: cfg
        shell: python
        run: |
          import yaml, os
          with open('.github/deploy-config.yml') as f:
              config = yaml.safe_load(f)
          g = config['global']
          c = config['components']['${{ matrix.component }}']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"registry={g['registry']}\n")
              out.write(f"repo={g['repo']}\n")
              out.write(f"context={c['context']}\n")
              out.write(f"dockerfile={c['dockerfile']}\n")

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.cfg.outputs.repo }}/${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ needs.detect.outputs.environment }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cast:
    name: Cast ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: needs.detect.outputs.components != '[]' && needs.detect.outputs.components != ''
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect.outputs.components) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read component config
        id: cfg
        shell: python
        run: |
          import yaml, os
          with open('.github/deploy-config.yml') as f:
              config = yaml.safe_load(f)
          cast = config['components']['${{ matrix.component }}'].get('cast', '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"cast={cast}\n")
              out.write(f"has_cast={'true' if cast else 'false'}\n")

      - uses: runestack/rune-cast-action@v1
        if: steps.cfg.outputs.has_cast == 'true'
        with:
          server: ${{ vars.RUNED_HOST }}
          token: ${{ secrets.RUNE_TOKEN }}
          source: ${{ steps.cfg.outputs.cast }}
          values: infra/runeset/values/${{ needs.detect.outputs.environment }}.yaml
          namespace: ${{ needs.detect.outputs.environment }}
          create-namespace: true
