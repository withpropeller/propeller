name: Deploy (manual)

# Manual deploy — pick component(s) and environment.
# For auto-deploy on push see deploy.yml

on:
  workflow_dispatch:
    inputs:
      components:
        description: 'Component(s) to deploy (comma-separated)'
        required: true
        type: string
        default: 'landing'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: 'stg'
        options:
          - stg
          - prod

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.components }}
  cancel-in-progress: false

jobs:
  split:
    name: Parse inputs
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.split.outputs.components }}
    steps:
      - id: split
        shell: python
        run: |
          import json, os
          raw = '${{ inputs.components }}'
          components = sorted(set(c.strip() for c in raw.split(',') if c.strip()))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'components={json.dumps(components)}\n')
          print(f'components: {components}')

  deploy:
    name: Deploy ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: split
    if: needs.split.outputs.components != '[]' && needs.split.outputs.components != ''
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.split.outputs.components) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Prep
        id: prep
        uses: ./.github/actions/cast-prep
        with:
          component: ${{ matrix.component }}
          environment: ${{ inputs.environment }}
          sha: ${{ github.sha }}
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        if: steps.prep.outputs.has_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.prep.outputs.has_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.prep.outputs.has_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.prep.outputs.context }}
          file: ${{ steps.prep.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}:${{ steps.prep.outputs.image_tag }}
            ${{ steps.prep.outputs.image_name }}:${{ inputs.environment }}
          build-args: ${{ steps.prep.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cast
        if: steps.prep.outputs.has_cast == 'true'
        uses: runestack/rune-cast-action@v1
        with:
          server: ${{ secrets.RUNED_HOST }}
          token: ${{ secrets.RUNE_TOKEN }}
          source: ${{ steps.prep.outputs.cast_file }}
          values: ${{ steps.prep.outputs.values_files }}
          namespace: ${{ steps.prep.outputs.namespace }}
          create-namespace: true
