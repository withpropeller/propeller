name: Deploy (manual)

# Manual deploy — pick component(s) and environment.
# For auto-deploy on push see deploy.yml

on:
  workflow_dispatch:
    inputs:
      components:
        description: 'Component(s) to deploy (comma-separated)'
        required: true
        type: string
        default: 'landing'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: 'stg'
        options:
          - stg
          - prod

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.components }}
  cancel-in-progress: false

jobs:
  split:
    name: Parse inputs
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.split.outputs.components }}
    steps:
      - id: split
        shell: python
        run: |
          import json, os
          raw = '${{ inputs.components }}'
          components = sorted(set(c.strip() for c in raw.split(',') if c.strip()))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'components={json.dumps(components)}\n')
          print(f'components: {components}')

  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: split
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.split.outputs.components) }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read component config
        id: cfg
        shell: python
        run: |
          import yaml, os
          with open('.github/deploy-config.yml') as f:
              config = yaml.safe_load(f)
          g = config['global']
          c = config['components']['${{ matrix.component }}']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"registry={g['registry']}\n")
              out.write(f"repo={g['repo']}\n")
              out.write(f"context={c['context']}\n")
              out.write(f"dockerfile={c['dockerfile']}\n")

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.cfg.outputs.repo }}/${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ inputs.environment }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cast:
    name: Cast ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: [split, build]
    if: always() && needs.build.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.split.outputs.components) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read component config
        id: cfg
        shell: python
        run: |
          import yaml, os
          with open('.github/deploy-config.yml') as f:
              config = yaml.safe_load(f)
          cast = config['components']['${{ matrix.component }}'].get('cast', '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"cast={cast}\n")
              out.write(f"has_cast={'true' if cast else 'false'}\n")

      - uses: runestack/rune-cast-action@v1
        if: steps.cfg.outputs.has_cast == 'true'
        with:
          server: ${{ vars.RUNED_HOST }}
          token: ${{ secrets.RUNE_TOKEN }}
          source: ${{ steps.cfg.outputs.cast }}
          values: infra/runeset/values/${{ inputs.environment }}.yaml
          namespace: ${{ inputs.environment }}
          create-namespace: true
