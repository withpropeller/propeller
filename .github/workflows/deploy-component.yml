name: Deploy (manual)

# Manual deploy — pick component(s) and environment.
# For auto-deploy on push see deploy.yml

on:
  workflow_dispatch:
    inputs:
      components:
        description: 'Component(s) to deploy (comma-separated)'
        required: true
        type: string
        default: 'landing'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: 'stg'
        options:
          - stg
          - prod

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.components }}
  cancel-in-progress: false

jobs:
  split:
    name: Parse inputs
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.split.outputs.components }}
    steps:
      - id: split
        shell: python
        run: |
          import json, os
          raw = '${{ inputs.components }}'
          components = sorted(set(c.strip() for c in raw.split(',') if c.strip()))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'components={json.dumps(components)}\n')
          print(f'components: {components}')

  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: split
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.split.outputs.components) }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read component config
        id: cfg
        shell: python
        run: |
          import yaml, os
          with open('.github/deploy-config.yml') as f:
              config = yaml.safe_load(f)
          g = config['global']
          c = config['components']['${{ matrix.component }}']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"registry={g['registry']}\n")
              out.write(f"repo={g['repo']}\n")
              out.write(f"context={c['context']}\n")
              out.write(f"dockerfile={c['dockerfile']}\n")

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.cfg.outputs.repo }}/${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ inputs.environment }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cast:
    name: Cast ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: [split, build]
    if: always() && needs.build.result != 'skipped'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.split.outputs.components) }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare cast file
        id: cfg
        shell: python
        run: |
          import yaml, re, os

          environment = '${{ inputs.environment }}'
          component   = '${{ matrix.component }}'

          with open('.github/deploy-config.yml') as f:
              config = yaml.safe_load(f)

          global_cfg = config['global']
          cast_file  = config['components'][component].get('cast', '')

          if not cast_file:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('has_cast=false\n')
              raise SystemExit(0)

          values_file = f'infra/runeset/values/{environment}.yaml'
          with open(values_file) as f:
              values = yaml.safe_load(f) or {}

          def flatten(d, prefix=''):
              result = {}
              for k, v in d.items():
                  key = f'{prefix}.{k}' if prefix else k
                  if isinstance(v, dict):
                      result.update(flatten(v, key))
                  else:
                      result[key] = v
              return result

          flat = flatten(values)

          # Fill registry from global config if values file omits it
          if 'registry' not in flat:
              flat['registry'] = f"{global_cfg['registry']}/{global_cfg['repo']}"

          # Use environment name as image tag when values file leaves it blank
          if not flat.get('app.tag'):
              flat['app.tag'] = environment

          with open(cast_file) as f:
              content = f.read()

          def replace(m):
              key = m.group(1).strip()
              return str(flat.get(key, m.group(0)))

          processed = re.sub(r'\{\{\s*values:([\w.]+)\s*\}\}', replace, content)
          out_path = '/tmp/processed-cast.yaml'
          with open(out_path, 'w') as f:
              f.write(processed)

          print('Processed cast file:')
          print(processed)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'cast_file={out_path}\n')
              out.write('has_cast=true\n')

      - uses: runestack/rune-cast-action@v1
        if: steps.cfg.outputs.has_cast == 'true'
        with:
          server: ${{ secrets.RUNED_HOST }}
          token: ${{ secrets.RUNE_TOKEN }}
          source: ${{ steps.cfg.outputs.cast_file }}
          namespace: ${{ inputs.environment }}
          create-namespace: true
