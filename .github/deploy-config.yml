# CI deploy config — the deploy.yml workflow reads this for each component.
#
# Fields consumed by the deploy-prep action:
#   dockerfile  – Path to the Dockerfile. Omit for cast-only components (e.g. mongo).
#   context     – Docker build context (relative to repo root). Defaults to "."
#   cast        – Rune cast YAML (relative to repo root). Omit to skip casting.
#   namespace   – Target namespace override (defaults to the environment name).
#   build_args  – Map of build-args passed to docker build.
#   paths       – Glob patterns that trigger a rebuild on push (deploy.yml auto-detect).
#
# Everything else (port, scale, env vars, health checks, resources, tls, deps) lives
# in the matching component block inside infra/runeset/values/<env>.yaml.

global:
  registry: ghcr.io
  repo: withpropeller/propeller

# Branch → environment mapping for auto-deploy
environments:
  dev: dev
  main: stg

components:

  # ── App services (use the multipurpose external-service cast) ─────

  landing:
    dockerfile: infra/docker/Dockerfile.landing
    context: .
    cast: infra/runeset/casts/external-service.yaml
    paths:
      - apps/landing/**
      - infra/docker/Dockerfile.landing
      - infra/docker/nginx.landing.conf

  web:
    dockerfile: infra/docker/Dockerfile.web
    context: .
    cast: infra/runeset/casts/external-service.yaml
    paths:
      - apps/web/**
      - infra/docker/Dockerfile.web

  docs:
    dockerfile: apps/docs/Dockerfile
    context: apps/docs
    cast: infra/runeset/casts/external-service.yaml
    paths:
      - apps/docs/**

  gateway:
    dockerfile: infra/docker/Dockerfile.nestjs
    context: .
    cast: infra/runeset/casts/external-service.yaml
    build_args:
      APP_DIR: gateway
      PORT: "3002"
    paths:
      - services/gateway/**
      - libs/core/**
      - infra/docker/Dockerfile.nestjs

  # ── Background workers (worker cast) ───────────────────────────────

  notifications:
    dockerfile: infra/docker/Dockerfile.worker
    context: .
    cast: infra/runeset/casts/worker.yaml
    build_args:
      WORKER_DIR: workers/notifications
    paths:
      - workers/notifications/**
      - libs/go-events/**
      - infra/docker/Dockerfile.worker

  # ── Infrastructure (cast-only, shared namespace) ──────────────────

  mongo:
    cast: infra/runeset/casts/mongo.yaml
    namespace: shared

  flo:
    cast: infra/runeset/casts/flo.yaml
    namespace: shared
