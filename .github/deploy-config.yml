# CI deploy config — the deploy.yml workflow reads this for each component.
#
# Fields consumed by CI:
#   context    – Docker build context (relative to repo root)
#   dockerfile – Path to the Dockerfile
#   cast       – Rune cast YAML (relative to repo root). Omit for cast-less deploys.
#
# Everything else (port, scale, env vars, health checks, resources, etc.)
# lives in the Rune cast + values files in infra/runeset/.

global:
  registry: ghcr.io
  repo: withpropeller/propeller

components:

  landing:
    dockerfile: infra/docker/Dockerfile.landing
    context: .
    cast: infra/runeset/casts/external-service.yaml

