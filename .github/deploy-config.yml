# Deployment Configuration for Propeller
#
# Each component defines how it's built and cast via Rune.
# The deploy.yml workflow reads this to decide:
#   1. What Docker image to build & push to GHCR
#   2. Whether it needs a rune cast (static components don't)
#   3. How to cast it (values file, etc.)
#
# Deployment flow:
#   Push to dev/main → deploy.yml detects changed components → builds → pushes to GHCR
#   You run `rune cast infra/runeset/ -f infra/runeset/values/dev.yaml` from your laptop
#
# When Rune gets registry-watch/auto-redeploy, the rune cast step becomes automatic.

global:
  registry: ghcr.io
  repo: withpropeller/propeller

components:
  # ── Apps ───────────────────────────────────────────────────────

  landing:
    type: app
    runtime: static            # nginx serves built assets
    port: 80
    replicas: 1
    dockerfile: infra/docker/Dockerfile.landing
    context: .
    cast: infra/runeset/casts/landing.yaml
    description: "Marketing landing page"
    paths:                     # Which files trigger a rebuild
      - apps/landing/**
      - infra/docker/Dockerfile.landing
      - infra/docker/nginx.landing.conf

