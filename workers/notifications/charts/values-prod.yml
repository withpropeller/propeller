replicas: 1
version: v1

# Service Specific Values
image:
    repository: {{{ deployment.REPOSITORY }}}

## Application level settings
app:
    env:
        #[security]
        APP_ENV: {{ deployment.ENV }}
        LOG_LEVEL: debug