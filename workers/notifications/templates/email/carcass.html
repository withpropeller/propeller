<html>

<head>
  <title>Propeller</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1a1a1a;
      line-height: 1.6;
    }

    a {
      color: #3E59F3;
      text-decoration: none;
    }

    a.btn {
      display: inline-block;
      border: none;
      border-radius: 8px;
      background-color: #3E59F3;
      color: #ffffff !important;
      font-weight: 600;
      font-size: 14px;
      padding: 14px 28px;
      margin: 16px 0;
      text-decoration: none;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    table th,
    table td {
      padding: 14px 16px;
      text-align: left;
    }

    table th {
      font-weight: 600;
      font-size: 13px;
      color: #6b6560;
      text-transform: uppercase;
      letter-spacing: 0.35px;
    }

    table td {
      font-size: 14px;
      border-bottom: 1px solid #ebe6df;
    }

    div.info-box {
      background-color: #faf8f5;
      border: 1px solid #ebe6df;
      padding: 20px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 14px;
    }

    div.info-box h4 {
      margin-top: 0;
      font-size: 13px;
      color: #6b6560;
      text-transform: uppercase;
      letter-spacing: 0.35px;
    }

    .muted {
      color: #6b6560;
    }

    .heading {
      font-size: 16px;
      font-weight: 600;
      color: #0F1556;
      margin-bottom: 8px;
    }

    .subheading {
      color: #6b6560;
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="container" style="margin: 0 auto; font-size: 14px; background-color: #f5f2ee;">

    <div style="padding: 40px 0 46px;">

      <div style="background-color: #ffffff; padding: 32px 28px; max-width: 640px; margin: 0 auto; border-radius: 12px; border: 1px solid #ebe6df;">

        <div style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #ebe6df;">
          <a href="https://withpropeller.com" style="text-decoration: none; display: inline-block;">
            <img
              src="https://app.withpropeller.com/propeller-logo-dark.svg"
              alt="Propeller"
              width="152"
              height="37"
              style="display: block; border: 0; max-width: 152px; height: auto;"
            />
          </a>
        </div>

        <div style="padding: 0 0 32px 0;">
          {{ .ContentBody }}
        </div>

        <div style="border-top: 1px solid #ebe6df; padding-top: 24px;">
          <div style="font-size: 13px; color: #6b6560; margin-bottom: 16px;">
            <p style="color: #6b6560; margin: 0 0 8px 0;">If you were not expecting this email, you can safely ignore it.</p>
            <p style="color: #6b6560; margin: 0;">Need help? Reach our support team at
              <a href="mailto:support@hyphenmoney.com" style="color: #3E59F3; text-decoration: none;">support@hyphenmoney.com</a>
            </p>
          </div>

          <div style="text-align: center; margin-top: 20px;">
            <a href="https://twitter.com/withpropeller" style="margin: 0 10px; color: #6b6560; text-decoration: none;">Twitter</a>
            <span style="color: #ddd5cb;">·</span>
            <a href="https://linkedin.com/company/withpropeller" style="margin: 0 10px; color: #6b6560; text-decoration: none;">LinkedIn</a>
          </div>

          <p style="font-size: 12px; color: #9e9690; text-align: center; margin-top: 16px; margin-bottom: 0;">
            Propeller &mdash; Sell to Africa. Get paid without the headache.
          </p>
        </div>

      </div>
    </div>
  </div>
</body>

</html>
