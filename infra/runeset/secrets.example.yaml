# Reference for Propeller secrets. NEVER commit real values — apply via:
#
#   rune create secret propeller-core      --from-literal=DATABASE_URL=...
#   rune create secret propeller-providers --from-literal=PAYSTACK_SECRET_KEY=... ...
#   rune create secret propeller-services  --from-literal=SESSION_SECRET=...
#   rune create secret propeller-office    --from-literal=CF_ACCESS_AUD=...
#
# Or via YAML applied with `rune cast`:
#
#   rune cast secrets.yaml
#
# Secrets are encrypted at rest in Rune. There is no read API
# from outside — the only way to read a secret is to mount it into a service.

secrets:
  # Shared core: ledger + datastore
  - name: propeller-core
    namespace: propeller
    data:
      - { key: DATABASE_URL, value: "<mongodb-atlas-uri>" }
      - { key: TB_CLUSTER_ID, value: "<tigerbeetle-cluster-id>" }
      - { key: TB_ADDRESSES, value: "<host1:4000,host2:4000,host3:4000>" }
      - { key: SENTRY_DSN, value: "<sentry-dsn>" }

  # Provider credentials (consumed by apps/api primarily)
  - name: propeller-providers
    namespace: propeller
    data:
      # Paystack
      - { key: PAYSTACK_SECRET_KEY, value: "<...>" }
      - { key: PAYSTACK_WEBHOOK_SECRET, value: "<...>" }
      # PayKKa
      - { key: PAYKKA_PRIVATE_KEY_PEM, value: "<-----BEGIN PRIVATE KEY-----...>" }
      - { key: PAYKKA_PUBLIC_KEY_PEM, value: "<-----BEGIN PUBLIC KEY-----...>" }
      - { key: PAYKKA_KEY_ID, value: "<platform-issued>" }
      - { key: PAYKKA_MERCH_ID, value: "<propeller-paykka-merch-id>" }
      - { key: PAYKKA_BASE_URL, value: "https://open-fat.cb.paykka.com" }
      # Dojah
      - { key: DOJAH_APP_ID, value: "<...>" }
      - { key: DOJAH_PUBLIC_KEY, value: "<...>" }
      - { key: DOJAH_SECRET_KEY, value: "<...>" }
      - { key: DOJAH_WEBHOOK_SECRET, value: "<...>" }
      # Globalstack (Passport)
      - { key: GLOBALSTACK_API_KEY, value: "<...>" }
      - { key: GLOBALSTACK_WEBHOOK_SECRET, value: "<...>" }
      - { key: GLOBALSTACK_BASE_URL, value: "https://sandbox.globalstack.io" }

  # Dashboard backend secrets
  - name: propeller-services
    namespace: propeller
    data:
      - { key: SESSION_SECRET, value: "<random-32-byte-base64>" }

  # Admin backend secrets
  - name: propeller-office
    namespace: propeller
    data:
      - { key: CF_ACCESS_AUD, value: "<cloudflare-access-audience>" }
      - { key: CF_ACCESS_TEAM_DOMAIN, value: "<your-team>.cloudflareaccess.com" }
