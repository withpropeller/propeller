# Staging values — pre-production mirror.

app:
  env: stg
  tag: ""

registry: ghcr.io/withpropeller/propeller
logLevel: info

landing:
  component:
    name: landing
    host: stg.withpropeller.com
    scale: 1
    port: 80
    healthPath: /healthz
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "128Mi"

web:
  component:
    name: web
    host: app.stg.withpropeller.com
    scale: 1
    port: 3000
    healthPath: /health
    tls: { mode: manual, secret: shared/cf-origin-cert }
    buildArgs:
      VITE_API_BASE_URL: https://gateway.stg.withpropeller.com
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

docs:
  component:
    name: docs
    host: docs.stg.withpropeller.com
    scale: 1
    port: 3000
    healthPath: /
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

api:
  component:
    name: api
    host: api.stg.withpropeller.com
    scale: 1
    port: 3001
    healthPath: /health
    tls: { mode: auto }
    env: { NODE_ENV: stg }
    envFrom:
      - secretRef: api-secrets
      - configRef: api-config
    dependencies:
      - { service: mongo, namespace: shared, readyWhen: healthy }
      - { service: flo,   namespace: shared, readyWhen: healthy }
    cpuRequest: "100m"
    cpuLimit: "1000m"
    memRequest: "256Mi"
    memLimit: "512Mi"

gateway:
  component:
    name: gateway
    host: gateway.stg.withpropeller.com
    scale: 1
    port: 3002
    healthPath: /health
    tls: { mode: auto }
    env: {}
    envFrom:
      - secretRef: gateway-env
      - configRef: gateway-config
    dependencies:
      - { service: mongo, namespace: shared, readyWhen: healthy }
      - { service: flo,   namespace: shared, readyWhen: healthy }
    cpuRequest: "100m"
    cpuLimit: "500m"
    memRequest: "128Mi"
    memLimit: "512Mi"

notifications:
  component:
    name: notifications
    scale: 1
    env:
      APP_ENV: stg
      LOG_LEVEL: info
      FLO_ADDR: "flo.shared.rune:9000"
      FROM_EMAIL: "Propeller <onboarding@usepropeller.com>"
    envFrom:
      - secretRef: notifications-secrets
    dependencies:
      - { service: flo, namespace: shared, readyWhen: healthy }
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"
