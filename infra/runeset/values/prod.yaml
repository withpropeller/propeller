# Production values.
# Shape: every app service declares a `component:` block consumed by
# infra/runeset/casts/external-service.yaml. The deploy-prep action lifts
# values.<component>.component → top-level `component:` via an overlay
# values file before rune cast renders the template.

app:
  env: prod
  tag: ""        # set per release by the deploy-prep action (sha-<short>)

registry: ghcr.io/withpropeller/propeller
logLevel: info

# ── Infrastructure (shared namespace) ─────────────────────────────

mongo:
  component:
    name: mongo
    volumeSize: 20Gi
    cpuRequest: "100m"
    cpuLimit: "2000m"
    memRequest: "512Mi"
    memLimit: "2Gi"

flo:
  component:
    name: flo
    volumeSize: 10Gi
    cpuRequest: "100m"
    cpuLimit: "2000m"
    memRequest: "256Mi"
    memLimit: "2Gi"
  tag: ""        # pin in prod; never use latest
  clientPort: 9000
  metricsPort: 9001
  dashboardPort: 9002

# ── Public app services (external-service cast) ────────────────────

landing:
  component:
    name: landing
    host: withpropeller.com
    scale: 1
    port: 80
    healthPath: /healthz
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "128Mi"

web:
  component:
    name: web
    host: app.withpropeller.com
    scale: 1
    port: 3000
    healthPath: /
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

docs:
  component:
    name: docs
    host: docs.withpropeller.com
    scale: 1
    port: 3000
    healthPath: /
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

gateway:
  component:
    name: gateway
    host: gateway.withpropeller.com
    scale: 1
    port: 3002
    healthPath: /health
    tls: { mode: auto }
    env: {}
    envFrom:
      - secretRef: gateway-env
      - configRef: gateway-config
    dependencies:
      - { service: mongo, namespace: shared, readyWhen: healthy }
      - { service: flo,   namespace: shared, readyWhen: healthy }
    cpuRequest: "200m"
    cpuLimit: "1000m"
    memRequest: "256Mi"
    memLimit: "1Gi"
  config:
    REDIS_URI: "redis://redis.prod:6379"
    MAIN_SITE_DOMAIN: "https://withpropeller.com"
    INFRA_WEB_DOMAIN: "https://app.withpropeller.com"
    AWS_REGION: "eu-west-1"
    S3_DOCUMENT_STORE_BUCKET: "propeller-documents-prod"
    PAYSTACK_URI: "https://api.paystack.co"
    FLUTTERWAVE_CALLBACK_URL: "https://gateway.withpropeller.com/flw/callback"
    PAYKKA_BASE_URL: ""
    SHORTENER_SERVICE_GRPC_URL: "shortener.prod:50051"
    ISV_SERVICE_GRPC_URL: "isv.prod:50052"
    BROWSERLESS_WS_URL: "ws://browserless.prod:3005"
    API_SERVICE_URL: "http://api.prod:3001"
    SECURE_SERVICE_URL: "http://secure.prod:3004"
    ENABLE_SWAGGER: "false"
    JWT_SECRET_EXPIRY: "3h"
    SLACK_EVENTS_CHANNEL: "#propeller-events"
  secrets:
    INFRA_JWT_SECRET: ""
    INFRA_ENCRYPTION_PASSPHRASE: ""
    MACHINE_KEY: ""
    S3_SECRET_ACCESS_KEY: ""
    S3_ACCESS_KEY_ID: ""
    FLUTTERWAVE_SECRET_KEY: ""
    PREMBLY_URI: ""
    PROVIDUS_THIRD_PARTY_URI: ""
    PAYKKA_API_KEY: ""
    PAYKKA_PRIVATE_KEY_PEM: ""
    PAYKKA_PUBLIC_KEY_PEM: ""
    PAYKKA_KEY_ID: ""
    SLACK_TOKEN: ""
