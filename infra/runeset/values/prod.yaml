# Production values.
# Shape: every app service declares a `component:` block consumed by
# infra/runeset/casts/external-service.yaml. The deploy-prep action lifts
# values.<component>.component → top-level `component:` via an overlay
# values file before rune cast renders the template.

app:
  env: prod
  tag: ""        # set per release by the deploy-prep action (sha-<short>)

registry: ghcr.io/withpropeller/propeller
logLevel: info

# ── Infrastructure (shared namespace) ─────────────────────────────

mongo:
  component:
    name: mongo
    volumeSize: 20Gi
    cpuRequest: "100m"
    cpuLimit: "2000m"
    memRequest: "512Mi"
    memLimit: "2Gi"

flo:
  component:
    name: flo
    volumeSize: 10Gi
    cpuRequest: "100m"
    cpuLimit: "2000m"
    memRequest: "256Mi"
    memLimit: "2Gi"
  tag: ""        # pin in prod; never use latest
  clientPort: 9000
  metricsPort: 9001
  dashboardPort: 9002

# ── Public app services (external-service cast) ────────────────────

landing:
  component:
    name: landing
    host: hyphenmoney.com
    scale: 1
    port: 80
    healthPath: /healthz
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "128Mi"

web:
  component:
    name: web
    host: app.hyphenmoney.com
    scale: 1
    port: 3000
    healthPath: /health
    buildArgs:
      VITE_API_BASE_URL: https://gateway.hyphenmoney.com
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

docs:
  component:
    name: docs
    host: docs.hyphenmoney.com
    scale: 1
    port: 3000
    healthPath: /
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

api:
  component:
    name: api
    host: api.hyphenmoney.com
    scale: 1
    port: 3001
    healthPath: /health
    env: { NODE_ENV: prod }
    envFrom:
      - secret: api-secrets
      - configmap: api-config
    dependencies:
      - mongo.shared.rune
      - flo.shared.rune
    cpuRequest: "200m"
    cpuLimit: "2000m"
    memRequest: "512Mi"
    memLimit: "1Gi"

# Internal-only api (internal-service cast — no public expose). Reachable only at
# api-internal.prod:3001. Accepts machine-key / infra-token auth from the gateway.
api-internal:
  component:
    name: api-internal
    scale: 1
    port: 3001
    healthPath: /health
    env: { NODE_ENV: prod, API_ALLOW_MACHINE_KEY: "true" }
    envFrom:
      - secret: api-secrets
      - configmap: api-config
    dependencies:
      - mongo.shared.rune
      - flo.shared.rune
    cpuRequest: "200m"
    cpuLimit: "2000m"
    memRequest: "512Mi"
    memLimit: "1Gi"

gateway:
  component:
    name: gateway
    host: gateway.hyphenmoney.com
    scale: 1
    port: 3002
    healthPath: /health
    env: { NODE_ENV: prod }
    envFrom:
      - secret: gateway-secrets
      - configmap: gateway-config
    dependencies:
      - mongo.shared.rune
      - flo.shared.rune
    cpuRequest: "200m"
    cpuLimit: "1000m"
    memRequest: "256Mi"
    memLimit: "1Gi"

webhook:
  component:
    name: webhook
    host: webhooks.hyphenmoney.com
    scale: 1
    port: 4000
    healthPath: /health
    env: {}
    envFrom:
      - secret: webhook-secrets
      - configmap: webhook-config
    dependencies:
      - flo.shared.rune
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

notifications:
  component:
    name: notifications
    scale: 1
    env:
      LOG_LEVEL: info
      FLO_ADDR: "flo.shared.rune:9000"
      FROM_EMAIL: "Hyphen <notifications@hyphenmoney.com>"
    envFrom:
      - secret: notifications-secrets
      - configmap: notifications-config
    dependencies:
      - flo.shared.rune
    cpuRequest: "100m"
    cpuLimit: "1000m"
    memRequest: "128Mi"
    memLimit: "512Mi"
