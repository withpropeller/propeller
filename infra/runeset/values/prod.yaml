# Production values — populated as Wave 5 hardens up.

app:
  tag: ""  # set per release: `rune cast --values=prod --set app.tag=v0.1.0`

logLevel: info

flo:
  tag: ""  # pin in prod; never use latest
  clientPort: 9000
  metricsPort: 9001
  dashboardPort: 9002
  cpuLimit: "2000m"
  memLimit: "2Gi"

landing:
  component:
    name: landing
    host: withpropeller.com
    scale: 1
    port: 80
    healthPath: /healthz
    cpuLimit: "500m"
    memLimit: "128Mi"

api:
  scale: 2
  port: 3001
  publicUrl: "https://api.propeller.xyz"
  cpuLimit: "1000m"
  memLimit: "1Gi"

services:
  scale: 2
  port: 3002
  cpuLimit: "1000m"
  memLimit: "1Gi"

office:
  scale: 1
  port: 3003
  cpuLimit: "500m"
  memLimit: "512Mi"

web:
  component:
    name: web
    host: app.withpropeller.com
    scale: 1
    port: 3000
    healthPath: /
    cpuLimit: "500m"
    memLimit: "256Mi"

gateway:
  component:
    name: gateway
    host: gateway.withpropeller.com
    scale: 1
    port: 3002
    healthPath: /health
    cpuLimit: "1000m"
    memLimit: "1Gi"
