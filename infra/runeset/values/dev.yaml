# Dev values — for staging-like local Rune deploys.

app:
  env: dev
  tag: dev

registry: ghcr.io/withpropeller/propeller
logLevel: debug

flo:
  component:
    name: flo
    volumeSize: 10Gi
    cpuRequest: "100m"
    cpuLimit: "1000m"
    memRequest: "256Mi"
    memLimit: "1Gi"
  tag: latest
  clientPort: 9000
  metricsPort: 9001
  dashboardPort: 9002

landing:
  component:
    name: landing
    host: dev.withpropeller.com
    scale: 1
    port: 80
    healthPath: /healthz
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "20m"
    cpuLimit: "100m"
    memRequest: "32Mi"
    memLimit: "64Mi"

web:
  component:
    name: web
    host: app.dev.withpropeller.com
    scale: 1
    port: 3000
    healthPath: /
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

docs:
  component:
    name: docs
    host: docs.dev.withpropeller.com
    scale: 1
    port: 3000
    healthPath: /
    tls: { mode: manual, secret: shared/cf-origin-cert }
    env: { NODE_ENV: production }
    envFrom: []
    dependencies: []
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "64Mi"
    memLimit: "256Mi"

gateway:
  component:
    name: gateway
    host: gateway.dev.withpropeller.com
    scale: 1
    port: 3002
    healthPath: /health
    tls: { mode: auto }
    env: {}
    envFrom:
      - secretRef: gateway-env
      - configRef: gateway-config
    dependencies:
      - { service: mongo, namespace: shared, readyWhen: healthy }
      - { service: flo,   namespace: shared, readyWhen: healthy }
    cpuRequest: "50m"
    cpuLimit: "500m"
    memRequest: "128Mi"
    memLimit: "512Mi"
