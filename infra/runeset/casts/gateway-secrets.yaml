# Gateway secrets — sensitive configuration for services/gateway.
# Apply:  rune cast infra/runeset/casts/gateway-secrets.yaml -n prod
#
# IMPORTANT: Replace empty values with actual secrets before applying!
#   Use: rune create secret gateway-secrets --from-literal=KEY=VALUE ...

secrets:
  - name: gateway-secrets
    data:
      JWT_SECRET: ""
      # HMAC secret used to sign internal infra tokens (gateway → api-internal).
      # Must match INFRA_SIGNING_KEY in api-secrets.
      INFRA_SIGNING_KEY: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_ACCESS_KEY_ID: ""
      PAYKKA_API_KEY: ""
      PAYKKA_PRIVATE_KEY_PEM: ""
      PAYKKA_PUBLIC_KEY_PEM: ""
      PAYKKA_KEY_ID: ""
      SLACK_TOKEN: ""

configmaps:
  - name: gateway-config
    data:
      PORT: "3002"
      LOG_LEVEL: "info"
      APP_ENV: prod
      MONGODB_URL: "mongodb://mongo.shared.rune:27017"
      FLO_ADDR: "flo.shared.rune:9000"
      MAIN_SITE_DOMAIN: "https://hyphenmoney.com"
      APP_DOMAIN: "https://app.hyphenmoney.com"
      # Comma-separated CORS allowlist (use `*` to reflect any origin).
      #ALLOWED_ORIGINS: "https://app.hyphenmoney.com,https://hyphenmoney.com"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,https://app.hyphenmoney.com,https://hyphenmoney.com"
      AWS_REGION: "eu-west-1"
      S3_DOCUMENT_STORE_BUCKET: "propeller-documents-prod"
      PAYSTACK_URI: "https://api.paystack.co"
      FLUTTERWAVE_CALLBACK_URL: "https://gateway.hyphenmoney.com/flw/callback"
      PAYKKA_BASE_URL: "https://open-fat.cb.paykka.com"
      SHORTENER_SERVICE_GRPC_URL: "shortener.prod:50051"
      ISV_SERVICE_GRPC_URL: "isv.prod:50052"
      BROWSERLESS_WS_URL: "ws://browserless.prod:3005"
      # Internal calls go to the network-isolated api-internal (not the public api).
      API_SERVICE_URL: "http://api-internal.prod.rune:3001"
      SECURE_SERVICE_URL: "http://secure.prod:3004"
      ENABLE_SWAGGER: "false"
      JWT_SECRET_EXPIRY: "3h"
      SLACK_EVENTS_CHANNEL: "#propeller-events"
