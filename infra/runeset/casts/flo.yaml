# Flo event bus — runs on Rune cluster in shared namespace.
# Apply:  rune cast infra/runeset/casts/flo.yaml -n shared --create-namespace

service:
  name: flo
  image: "ghcr.io/floruntime/flo:0.1.0-dev.3"
  imagePull: always
  scale: 1
  ports:
    - name: client
      port: 9000
    - name: metrics
      port: 9001
    - name: dashboard
      port: 9002
  # Use image ENTRYPOINT (/usr/local/bin/docker-entrypoint.sh): it chowns
  # /data/flo on a fresh mount, then `exec su-exec flo:flo flo "$@"` drops to
  # uid 1000. Overriding `command:` bypasses the wrapper and leaves flo
  # running as root.
  args:
    - server
    - start
    - -c
    - /etc/flo/flo.toml
  volumes:
    - name: flo-data
      mountPath: /data/flo
      claimTemplate:
        storageClassName: do-lon1
        size: "10Gi"
        accessMode: ReadWriteOnce
  securityContext:
    seccompProfile:
      type: Unconfined
  health:
    liveness:
      type: tcp
      port: 9000
      intervalSeconds: 10
      timeoutSeconds: 5
    readiness:
      type: http
      path: /health
      port: 9002
      initialDelaySeconds: 5
      intervalSeconds: 10
      timeoutSeconds: 5
  resources:
    cpu:
      request: "100m"
      limit: "2000m"
    memory:
      request: "256Mi"
      limit: "2Gi"
