# Webhook receiver secrets + config — for services/webhook.
# Apply:  rune cast infra/runeset/casts/webhook-secrets.yaml -n prod
#
# IMPORTANT: Replace empty values with actual secrets before applying!
#   Use: rune create secret webhook-secrets --from-literal=KEY=VALUE ...
#
# The webhook receives callbacks from every provider, so it holds each
# provider's verification secret:
#   - Paystack/Dojah/Globalstack: HMAC webhook secrets
#   - PayKKa: their PUBLIC key (we verify their RSA-signed callbacks with it)

secrets:
  - name: webhook-secrets
    data:
      PAYSTACK_SECRET_KEY: ""
      PAYSTACK_WEBHOOK_SECRET: ""
      # PayKKa's public key — used to verify inbound assessment/notify callbacks.
      PAYKKA_PUBLIC_KEY_PEM: ""
      DOJAH_WEBHOOK_SECRET: ""
      GLOBALSTACK_WEBHOOK_SECRET: ""

configmaps:
  - name: webhook-config
    data:
      PORT: "4000"
      LOG_LEVEL: "info"
      FLO_ADDR: "flo.shared.rune:9000"
      # Provider enable flags — only enabled providers get a verifier registered.
      PAYSTACK_ENABLED: "true"
      PAYKKA_ENABLED: "true"
      DOJAH_ENABLED: "false"
      GLOBALSTACK_ENABLED: "false"
      # Path component of the callback URL registered with PayKKa. Must match
      # exactly what PayKKa POSTs to — it is part of the signed canonical string.
      PAYKKA_CALLBACK_PATH: "/paykka"
