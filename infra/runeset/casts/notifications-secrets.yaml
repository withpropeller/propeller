# Notifications worker secrets — Resend API key and related credentials.
# Apply:  rune cast infra/runeset/casts/notifications-secrets.yaml -n <env>
#
# IMPORTANT: Replace empty values with actual secrets before applying!
#   rune create secret notifications-secrets --from-literal=RESEND_API_KEY=re_...

secrets:
  - name: notifications-secrets
    data:
      RESEND_API_KEY: ""

configmaps:
  - name: notifications-config
    data:
      FLO_ADDR: "flo.shared.rune:9000"
