# Gateway (services/gateway) — NestJS backend.
# Deployed by CI (cast-prep action resolves {{ values:... }}).
# Apply locally:  rune cast infra/runeset/casts/gateway.yaml -n prod --set all...
#
# For local deploys, use infra/runeset/casts/gateway-local.yaml instead.

service:
  name: "{{ values:component.name }}"
  image: "{{ values:registry }}/{{ values:component.name }}:{{ values:app.tag }}"
  imagePull: missing
  scale: {{ values:component.scale }}
  ports:
    - name: http
      port: {{ values:component.port }}
  expose:
    host: "{{ values:component.host }}"
    port: http
    tls:
      mode: auto
  envFrom:
    - secretRef: gateway-env
    - configRef: gateway-config
  dependencies:
    - service: mongo
      namespace: "{{ values:component.mongoNamespace }}"
      readyWhen: healthy
    - service: flo
      namespace: "{{ values:component.floNamespace }}"
      readyWhen: healthy
  health:
    liveness:
      type: http
      path: "{{ values:component.healthPath }}"
      port: {{ values:component.port }}
      intervalSeconds: 10
      timeoutSeconds: 5
  resources:
    cpu:
      request: "{{ values:component.cpuRequest }}"
      limit: "{{ values:component.cpuLimit }}"
    memory:
      request: "{{ values:component.memRequest }}"
      limit: "{{ values:component.memLimit }}"
