# API service secrets + non-secret config for services/api.
# Apply:  rune cast infra/runeset/casts/api-secrets.yaml -n <env>
#
# IMPORTANT: Replace empty secret values before applying!
#   rune create secret api-secrets --from-literal=INFRA_ENCRYPTION_PASSPHRASE=...

secrets:
  - name: api-secrets
    data:
        S3_ACCESS_KEY_ID: ""
        S3_SECRET_ACCESS_KEY: ""
        SLACK_TOKEN: ""

configmaps:
  - name: api-config
    data:
      PORT: "3001"
      LOG_LEVEL: "info"
      MONGODB_URL: "mongodb://mongo.shared.rune:27017"
      FLO_ADDR: "flo://flo.shared.rune:9000"
      ENABLE_SWAGGER: "false"
      AWS_REGION: "eu-west-1"
      S3_DOCUMENT_STORE_BUCKET: "propeller-documents-prod"
