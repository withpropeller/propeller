# API service secrets + non-secret config for services/api.
# Apply:  rune cast infra/runeset/casts/api-secrets.yaml -n <env>
#
# IMPORTANT: Replace empty secret values before applying!
#   rune create secret api-secrets --from-literal=INFRA_ENCRYPTION_PASSPHRASE=...

secrets:
  - name: api-secrets
    data:
        S3_ACCESS_KEY_ID: ""
        S3_SECRET_ACCESS_KEY: ""
        SLACK_TOKEN: ""
        # HMAC secret for verifying internal infra tokens. Must match
        # INFRA_SIGNING_KEY in gateway-secrets. Only enforced where
        # API_ALLOW_MACHINE_KEY=true (api-internal); harmless on the public api.
        # During rotation, set INFRA_SIGNING_KEY_PREVIOUS to the old value so both
        # are accepted until the gateway has fully rolled over to the new key.
        INFRA_SIGNING_KEY: ""
        INFRA_SIGNING_KEY_PREVIOUS: ""

configmaps:
  - name: api-config
    data:
      PORT: "3001"
      LOG_LEVEL: "info"
      MONGODB_URL: "mongodb://mongo.shared.rune:27017"
      FLO_ADDR: "flo://flo.shared.rune:9000"
      ENABLE_SWAGGER: "false"
      AWS_REGION: "eu-west-1"
      S3_DOCUMENT_STORE_BUCKET: "propeller-documents-prod"
