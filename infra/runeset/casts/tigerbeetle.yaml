# TigerBeetle — financial accounting database in shared namespace.
# Apply:  rune cast infra/runeset/casts/tigerbeetle.yaml -n shared

service:
  name: tigerbeetle
  image: "ghcr.io/tigerbeetle/tigerbeetle:latest"
  imagePull: missing
  scale: 1
  ports:
    - name: tb
      port: 4000
  env:
    TB_ADDRESSES: "0.0.0.0:4000"
  command: /tigerbeetle
  args:
    - start
    - --addresses=0.0.0.0:4000
    - --cache-grid=256MiB
    - /data/0_0.tigerbeetle
  volumes:
    - name: tb-data
      mountPath: /data
      claimTemplate:
        storageClassName: local
        size: "10Gi"
        accessMode: ReadWriteOnce
  initSteps:
    - name: format
      image: "ghcr.io/tigerbeetle/tigerbeetle:latest"
      command: /tigerbeetle
      args:
        - format
        - --cluster=0
        - --replica=0
        - --replica-count=1
        - /data/0_0.tigerbeetle
  securityContext:
    seccompProfile:
      type: Unconfined
  health:
    liveness:
      type: tcp
      port: 4000
      intervalSeconds: 10
      timeoutSeconds: 5
  resources:
    cpu:
      request: "100m"
      limit: "1000m"
    memory:
      request: "1Gi"
      limit: "2500Mi"
