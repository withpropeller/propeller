# Flo server configuration (source of truth).
#
# Loaded into Rune as configmap shared/flo-config, mounted at /etc/flo/flo.toml.
# After editing:
#   rune create config flo-config -n shared \
#     --from-file=flo.toml=infra/flo.toml --replace
#   rune restart flo -n shared

[server]
port = 9000
bind = "0.0.0.0"
data_dir = "/data/flo"
shards = 0    # auto-detect (CPUs - 1 in latest image)

[storage]
hot_window_seconds = 90
durability = "async_flush"

[logging]
level = "debug"

[metrics]
enabled = true
# port = 9001 (auto: listen_port + 1)

[dashboard]
enabled = true
bind = "0.0.0.0"
# port = 9002 (auto: listen_port + 2)
